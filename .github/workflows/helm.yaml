name: Build and Release Helm Chart to GHCR

# A push to main lints and packages the chart; only a v* tag publishes it. The
# chart version is immutable that way: before, every push to main pushed the
# chart again under the version in Chart.yaml and changed the digest of a
# released version.
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: false   # never abort a push half-way

jobs:
  helm-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write        # push to ghcr.io
      id-token: write        # keyless cosign
    defaults:
      run:
        shell: bash
        working-directory: ./deploy/helm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Read chart name & version
        id: meta
        run: |
          NAME=$(yq '.name' Chart.yaml 2>/dev/null || awk '/^name:/{print $2}' Chart.yaml)
          VERSION=$(yq '.version' Chart.yaml 2>/dev/null || awk '/^version:/{print $2}' Chart.yaml)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Helm lint & deps
        run: |
          helm lint .
          helm dependency build .

      - name: Package chart
        run: |
          mkdir -p dist
          helm package ./ --destination dist

      - name: Tag matches the chart version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$VERSION" || { echo "tag $TAG is not chart version v$VERSION"; exit 1; }

      - name: Login to GHCR for Helm OCI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      - name: Push to GHCR (OCI) and sign by digest (cosign keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CHART: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out=$(helm push "dist/${CHART}-${VERSION}.tgz" "oci://ghcr.io/${OWNER}" 2>&1)
          echo "$out"
          digest=$(awk '/^Digest:/{print $2}' <<<"$out")
          test -n "$digest"
          printf '%s' "$TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          cosign sign --yes "ghcr.io/${OWNER}/${CHART}@${digest}"
          echo "Pushed and signed: ghcr.io/${OWNER}/${CHART}:${VERSION}@${digest}"
