name: Build and Release Helm Chart to GHCR

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: false   # never abort a push half-way

jobs:
  helm-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write        # push to ghcr.io
      id-token: write        # keyless cosign
    defaults:
      run:
        shell: bash
        working-directory: ./deploy/helm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Read chart name & version
        id: meta
        run: |
          NAME=$(yq '.name' Chart.yaml 2>/dev/null || awk '/^name:/{print $2}' Chart.yaml)
          VERSION=$(yq '.version' Chart.yaml 2>/dev/null || awk '/^version:/{print $2}' Chart.yaml)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Helm lint & deps
        run: |
          helm lint .
          helm dependency build .

      - name: Package chart
        run: |
          mkdir -p dist
          helm package ./ --destination dist

      - name: Login to GHCR for Helm OCI
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      - name: Push to GHCR (OCI) and sign by digest (cosign keyless)
        env:
          CHART: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out=$(helm push "dist/${CHART}-${VERSION}.tgz" "oci://ghcr.io/${OWNER}" 2>&1)
          echo "$out"
          digest=$(awk '/^Digest:/{print $2}' <<<"$out")
          test -n "$digest"
          printf '%s' "$TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          cosign sign --yes "ghcr.io/${OWNER}/${CHART}@${digest}"
          echo "Pushed and signed: ghcr.io/${OWNER}/${CHART}:${VERSION}@${digest}"
